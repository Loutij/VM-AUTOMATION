#cloud-config
# =============================================================================
# Debian Cloud-Init Configuration Template
# Variables Jinja2: {{ variable_name }}
# Pour les images cloud Debian (debian-12-generic-amd64.qcow2)
# =============================================================================

# =============================================================================
# Configuration de base
# =============================================================================
hostname: {{ hostname | default('debian-vm') }}
fqdn: {{ hostname | default('debian-vm') }}.{{ domain | default('localdomain') }}
manage_etc_hosts: true
prefer_fqdn_over_hostname: true

# =============================================================================
# Locale et timezone
# =============================================================================
locale: {{ locale | default('fr_FR.UTF-8') }}
timezone: {{ timezone | default('Europe/Paris') }}

# =============================================================================
# Utilisateurs
# =============================================================================
users:
  - name: {{ username | default('otoroot') }}
    gecos: {{ user_fullname | default('Administrator') }}
    groups: [sudo, adm, systemd-journal]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: false
    {% if user_password_hash %}
    passwd: {{ user_password_hash }}
    {% elif user_password %}
    passwd: {{ user_password }}
    {% endif %}
    {% if ssh_authorized_keys %}
    ssh_authorized_keys:
      {% for key in ssh_authorized_keys %}
      - {{ key }}
      {% endfor %}
    {% endif %}

# Désactiver l'utilisateur par défaut debian/ubuntu si présent
disable_root: true

# =============================================================================
# Configuration SSH
# =============================================================================
ssh_pwauth: {{ ssh_password_auth | default(true) }}
ssh_deletekeys: true
ssh_genkeytypes: [rsa, ecdsa, ed25519]

# =============================================================================
# Configuration réseau (si statique)
# =============================================================================
{% if static_ip %}
network:
  version: 2
  ethernets:
    eth0:
      addresses:
        - {{ ip_address }}/{{ subnet_prefix | default('24') }}
      gateway4: {{ gateway }}
      nameservers:
        addresses:
          - {{ dns_server_1 | default('8.8.8.8') }}
          {% if dns_server_2 %}
          - {{ dns_server_2 }}
          {% endif %}
        search:
          - {{ domain | default('localdomain') }}
{% endif %}

# =============================================================================
# Paquets à installer
# =============================================================================
package_update: true
package_upgrade: true
package_reboot_if_required: true

packages:
  - qemu-guest-agent
  - openssh-server
  - sudo
  - curl
  - wget
  - vim
  - htop
  - net-tools
  - python3
  - python3-pip
  - git
  - unzip
  {% for pkg in extra_packages | default([]) %}
  - {{ pkg }}
  {% endfor %}

# =============================================================================
# Configuration NTP
# =============================================================================
ntp:
  enabled: true
  servers:
    - {{ ntp_server | default('0.debian.pool.ntp.org') }}
    - 1.debian.pool.ntp.org
    - 2.debian.pool.ntp.org

# =============================================================================
# Scripts d'initialisation
# =============================================================================
runcmd:
  # Activer et démarrer le guest agent
  - systemctl enable qemu-guest-agent
  - systemctl start qemu-guest-agent
  
  # Configuration SSH sécurisée
  - sed -i 's/#PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
  - sed -i 's/#MaxAuthTries.*/MaxAuthTries 3/' /etc/ssh/sshd_config
  - systemctl restart sshd
  
  {% for cmd in post_install_commands | default([]) %}
  - {{ cmd }}
  {% endfor %}
  
  # Signal de fin d'installation
  - echo "Cloud-init configuration completed at $(date)" >> /var/log/cloud-init-custom.log

# =============================================================================
# Écriture de fichiers
# =============================================================================
write_files:
  # Message of the day
  - path: /etc/motd
    content: |
      ============================================
      VM: {{ hostname | default('debian-vm') }}
      Deployed by VM-Automation
      ============================================
    permissions: '0644'
  
  # Configuration sysctl pour la performance
  - path: /etc/sysctl.d/99-vm-tuning.conf
    content: |
      # VM Performance tuning
      vm.swappiness=10
      net.core.somaxconn=65535
      net.ipv4.tcp_max_syn_backlog=65535
    permissions: '0644'

  {% for file in extra_files | default([]) %}
  - path: {{ file.path }}
    content: |
      {{ file.content | indent(6) }}
    permissions: '{{ file.permissions | default('0644') }}'
  {% endfor %}

# =============================================================================
# Configuration finale
# =============================================================================
final_message: |
  Cloud-init configuration completed!
  Hostname: {{ hostname | default('debian-vm') }}
  IP: $INSTANCE_ID
  Uptime: $UPTIME seconds
