# =============================================================================
# RHEL 9 - Kickstart Installation Template
# Variables Jinja2: {{ variable_name }}
# =============================================================================

# Installation method
{% if install_url %}
url --url="{{ install_url }}"
{% else %}
cdrom
{% endif %}

# Accept EULA
eula --agreed

# System language
lang {{ locale | default('fr_FR.UTF-8') }}

# Keyboard layout
keyboard --xlayouts='{{ keyboard_layout | default('fr') }}'

# Network configuration
{% if static_ip %}
network --bootproto=static --device=eth0 --ip={{ ip_address }} --netmask={{ netmask | default('255.255.255.0') }} --gateway={{ gateway }} --nameserver={{ dns_server_1 | default('8.8.8.8') }}{% if dns_server_2 %},{{ dns_server_2 }}{% endif %} --hostname={{ hostname | default('rhel9-vm') }} --activate
{% else %}
network --bootproto=dhcp --device=eth0 --hostname={{ hostname | default('rhel9-vm') }} --activate
{% endif %}

# Root password (encrypted with SHA-512)
{% if root_password_hash %}
rootpw --iscrypted {{ root_password_hash }}
{% else %}
rootpw --plaintext {{ root_password | default('tooroto') }}
{% endif %}

# System timezone
timezone {{ timezone | default('Europe/Paris') }} --utc

# Partitioning
ignoredisk --only-use=sda
clearpart --all --initlabel --drives=sda
autopart --type=lvm

# Bootloader
bootloader --location=mbr --boot-drive=sda

# Disable firewall during install (can be configured later)
firewall --disabled

# Enable SELinux
selinux --enforcing

# Services
services --enabled="sshd,chronyd"

# Don't run the Setup Agent on first boot
firstboot --disabled

# Reboot after installation
reboot --eject

# Package selection
%packages
@^minimal-environment
@standard
openssh-server
openssh-clients
vim-enhanced
curl
wget
net-tools
bind-utils
chrony
python3
{% for pkg in additional_packages | default([]) %}
{{ pkg }}
{% endfor %}
%end

# Pre-installation script
%pre --interpreter=/bin/bash --log=/tmp/ks-pre.log
echo "Starting pre-installation script..."
%end

# Post-installation script
%post --interpreter=/bin/bash --log=/root/ks-post.log

echo "=== Post-installation script starting ==="

# Configure SSH
sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config

# Enable and start SSH
systemctl enable sshd
systemctl start sshd

# Update system
dnf update -y

# Configure firewall
systemctl enable firewalld
systemctl start firewalld
firewall-cmd --permanent --add-service=ssh
firewall-cmd --reload

{% if create_user %}
# Create additional user
useradd -m -G wheel {{ username }}
echo "{{ username }}:{{ user_password }}" | chpasswd
{% endif %}

{% if join_domain %}
# Install packages for AD join
dnf install -y realmd sssd oddjob oddjob-mkhomedir adcli samba-common-tools

# Join Active Directory
echo "{{ domain_password }}" | realm join --user={{ domain_user }} {{ domain_name }}

# Configure SSSD
authselect select sssd with-mkhomedir --force
systemctl enable sssd
systemctl start sssd
{% endif %}

{% if callback_url %}
# Callback to automation server
curl -X POST -H "Content-Type: application/json" \
    -d '{"hostname":"{{ hostname | default('rhel9-vm') }}","status":"completed"}' \
    "{{ callback_url }}" || true
{% endif %}

echo "=== Post-installation script complete ==="

%end

# Addon for Red Hat Subscription
{% if rhsm_org and rhsm_key %}
%addon com_redhat_subscription
activation-key="{{ rhsm_key }}"
org="{{ rhsm_org }}"
%end
{% endif %}
