# =============================================================================
# Rocky Linux 9 - Kickstart Installation Template
# Variables Jinja2: {{ variable_name }}
# =============================================================================

# Installation method
{% if install_url %}
url --url="{{ install_url }}"
{% else %}
cdrom
{% endif %}

# System language
lang {{ locale | default('fr_FR.UTF-8') }}

# Keyboard layout
keyboard --xlayouts='{{ keyboard_layout | default('fr') }}'

# Network configuration
{% if static_ip %}
network --bootproto=static --device=eth0 --ip={{ ip_address }} --netmask={{ netmask | default('255.255.255.0') }} --gateway={{ gateway }} --nameserver={{ dns_server_1 | default('8.8.8.8') }}{% if dns_server_2 %},{{ dns_server_2 }}{% endif %} --hostname={{ hostname | default('rocky9-vm') }} --activate
{% else %}
network --bootproto=dhcp --device=eth0 --hostname={{ hostname | default('rocky9-vm') }} --activate
{% endif %}

# Root password
{% if root_password_hash %}
rootpw --iscrypted {{ root_password_hash }}
{% else %}
rootpw --plaintext {{ root_password | default('TempP@ss123!') }}
{% endif %}

# System timezone
timezone {{ timezone | default('Europe/Paris') }} --utc

# Partitioning
ignoredisk --only-use=sda
clearpart --all --initlabel --drives=sda

{% if custom_partitioning %}
# Custom partitioning
part /boot/efi --fstype="efi" --ondisk=sda --size=600 --fsoptions="umask=0077,shortname=winnt"
part /boot --fstype="xfs" --ondisk=sda --size=1024
part pv.01 --fstype="lvmpv" --ondisk=sda --grow
volgroup vg_root pv.01
logvol / --fstype="xfs" --name=lv_root --vgname=vg_root --size={{ root_size_gb | default(20) }}000
logvol /var --fstype="xfs" --name=lv_var --vgname=vg_root --size={{ var_size_gb | default(10) }}000
logvol /home --fstype="xfs" --name=lv_home --vgname=vg_root --grow
logvol swap --name=lv_swap --vgname=vg_root --size=4096
{% else %}
autopart --type=lvm
{% endif %}

# Bootloader
bootloader --location=mbr --boot-drive=sda --append="crashkernel=auto"

# Disable firewall during install
firewall --disabled

# Enable SELinux
selinux --enforcing

# Services
services --enabled="sshd,chronyd"

# Don't run the Setup Agent on first boot
firstboot --disabled

# Accept EULA
eula --agreed

# Reboot after installation
reboot --eject

# Package selection
%packages
@^minimal-environment
@standard
openssh-server
openssh-clients
vim-enhanced
curl
wget
net-tools
bind-utils
chrony
python3
bash-completion
tar
unzip
{% for pkg in additional_packages | default([]) %}
{{ pkg }}
{% endfor %}
%end

# Post-installation script
%post --interpreter=/bin/bash --log=/root/ks-post.log

echo "=== Post-installation script starting ==="

# Configure SSH for remote access
sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
systemctl enable sshd
systemctl restart sshd

# Configure firewall
systemctl enable firewalld
systemctl start firewalld
firewall-cmd --permanent --add-service=ssh
firewall-cmd --reload

# Update system
dnf update -y

{% if create_user %}
# Create additional user with sudo access
useradd -m -G wheel {{ username }}
echo "{{ username }}:{{ user_password }}" | chpasswd
# Enable sudo without password for wheel group (optional)
{% if sudo_nopasswd %}
echo "%wheel ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers.d/wheel
{% endif %}
{% endif %}

{% if ssh_keys %}
# Add SSH keys
mkdir -p /root/.ssh
chmod 700 /root/.ssh
cat > /root/.ssh/authorized_keys << 'SSHKEYS'
{% for key in ssh_keys %}
{{ key }}
{% endfor %}
SSHKEYS
chmod 600 /root/.ssh/authorized_keys
{% endif %}

{% if join_domain %}
# Install packages for AD join
dnf install -y realmd sssd oddjob oddjob-mkhomedir adcli samba-common-tools krb5-workstation

# Join Active Directory
echo "{{ domain_password }}" | realm join --user={{ domain_user }} {{ domain_name }}

# Configure SSSD
authselect select sssd with-mkhomedir --force
systemctl enable sssd
systemctl start sssd
{% endif %}

{% if callback_url %}
# Callback to automation server
curl -X POST -H "Content-Type: application/json" \
    -d '{"hostname":"{{ hostname | default('rocky9-vm') }}","status":"completed","ip":"$(hostname -I | awk '\''{print $1}'\'')"}' \
    "{{ callback_url }}" || true
{% endif %}

echo "=== Post-installation script complete ==="

%end
