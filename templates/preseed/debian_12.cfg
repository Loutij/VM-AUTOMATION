# =============================================================================
# Debian 12 (Bookworm) - Preseed Configuration Template
# Variables Jinja2: {{ variable_name }}
# =============================================================================

# Prevent all interactive prompts
d-i auto-install/enable boolean true
d-i debconf/priority select critical

# =============================================================================
# Localisation
# =============================================================================
d-i debian-installer/locale string {{ locale | default('fr_FR.UTF-8') }}
d-i debian-installer/language string {{ language | default('fr') }}
d-i debian-installer/country string {{ country | default('FR') }}
d-i keyboard-configuration/xkb-keymap select {{ keyboard_layout | default('fr') }}

# =============================================================================
# Réseau
# =============================================================================
d-i netcfg/choose_interface select auto
d-i netcfg/hostname string {{ hostname | default('debian-vm') }}
d-i netcfg/get_domain string {{ domain | default('localdomain') }}

{% if static_ip %}
# Configuration IP statique
d-i netcfg/disable_autoconfig boolean true
d-i netcfg/get_ipaddress string {{ ip_address }}
d-i netcfg/get_netmask string {{ netmask | default('255.255.255.0') }}
d-i netcfg/get_gateway string {{ gateway }}
d-i netcfg/get_nameservers string {{ dns_servers | default('8.8.8.8 8.8.4.4') }}
d-i netcfg/confirm_static boolean true
{% else %}
# DHCP
d-i netcfg/disable_autoconfig boolean false
{% endif %}

# =============================================================================
# Miroir et sources
# =============================================================================
d-i mirror/country string {{ mirror_country | default('France') }}
d-i mirror/http/hostname string {{ mirror_host | default('deb.debian.org') }}
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string {{ http_proxy | default('') }}

# =============================================================================
# Compte utilisateur
# =============================================================================
# Désactiver le compte root et créer un utilisateur sudo
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true

d-i passwd/user-fullname string {{ user_fullname | default('Administrator') }}
d-i passwd/username string {{ username | default('otoroot') }}
{% if user_password_crypted %}
d-i passwd/user-password-crypted password {{ user_password_crypted }}
{% else %}
d-i passwd/user-password password {{ user_password | default('tooroto') }}
d-i passwd/user-password-again password {{ user_password | default('tooroto') }}
d-i user-setup/allow-password-weak boolean true
{% endif %}
d-i user-setup/encrypt-home boolean false

# =============================================================================
# Horloge et fuseau horaire
# =============================================================================
d-i clock-setup/utc boolean true
d-i time/zone string {{ timezone | default('Europe/Paris') }}
d-i clock-setup/ntp boolean true
d-i clock-setup/ntp-server string {{ ntp_server | default('0.debian.pool.ntp.org') }}

# =============================================================================
# Partitionnement
# =============================================================================
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string max
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

{% if partman_recipe %}
# Recette de partitionnement personnalisée
d-i partman-auto/expert_recipe string \
    custom :: \
        {{ partman_recipe }}
{% else %}
# Partitionnement automatique avec LVM
d-i partman-auto/choose_recipe select atomic
{% endif %}

d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# =============================================================================
# Installation du système de base
# =============================================================================
d-i base-installer/install-recommends boolean true
d-i base-installer/kernel/image string linux-image-amd64

# =============================================================================
# Configuration APT
# =============================================================================
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org

# =============================================================================
# Sélection des paquets
# =============================================================================
tasksel tasksel/first multiselect {{ tasksel_packages | default('standard, ssh-server') }}

d-i pkgsel/include string {{ packages | default('openssh-server sudo curl wget vim htop net-tools python3 python3-pip hyperv-daemons') }}
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/update-policy select unattended-upgrades

# Participation au popularity-contest
popularity-contest popularity-contest/participate boolean false

# =============================================================================
# GRUB
# =============================================================================
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

# =============================================================================
# Fin de l'installation
# =============================================================================
d-i finish-install/keep-consoles boolean true
d-i finish-install/reboot_in_progress note

# =============================================================================
# Scripts de post-installation
# =============================================================================
d-i preseed/late_command string \
    in-target bash -c 'echo "{{ username | default('otoroot') }} ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/{{ username | default('otoroot') }}'; \
    in-target chmod 440 /etc/sudoers.d/{{ username | default('otoroot') }}; \
    in-target systemctl enable ssh; \
{% if static_ip %}
    echo -e "auto lo\niface lo inet loopback\n\nauto eth0\niface eth0 inet static\n  address {{ ip_address }}\n  netmask {{ netmask | default('255.255.255.0') }}\n  gateway {{ gateway }}\n  dns-nameservers {{ dns_servers | default('8.8.8.8 8.8.4.4') }}\n" > /target/etc/network/interfaces; \
{% else %}
    echo -e "auto lo\niface lo inet loopback\n\nauto eth0\niface eth0 inet dhcp\n" > /target/etc/network/interfaces; \
{% endif %}
    in-target systemctl enable networking; \
    in-target systemctl enable hv-kvp-daemon || true; \
    {% if ssh_authorized_keys %}
    in-target mkdir -p /home/{{ username | default('otoroot') }}/.ssh; \
    in-target bash -c 'echo "{{ ssh_authorized_keys | join('\n') }}" > /home/{{ username | default('otoroot') }}/.ssh/authorized_keys'; \
    in-target chmod 700 /home/{{ username | default('otoroot') }}/.ssh; \
    in-target chmod 600 /home/{{ username | default('otoroot') }}/.ssh/authorized_keys; \
    in-target chown -R {{ username | default('otoroot') }}:{{ username | default('otoroot') }} /home/{{ username | default('otoroot') }}/.ssh; \
    {% endif %}
    {% for cmd in post_install_commands | default([]) %}
    in-target {{ cmd }}; \
    {% endfor %}
    echo "Post-installation completed"
